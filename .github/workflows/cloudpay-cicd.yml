name: CloudPay CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Auth Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cloudpay-auth:latest ./services/auth-service
          docker push ${{ secrets.DOCKER_USERNAME }}/cloudpay-auth:latest

      - name: Build and Push Transaction Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cloudpay-transaction:latest ./services/transaction-service
          docker push ${{ secrets.DOCKER_USERNAME }}/cloudpay-transaction:latest

      - name: Build and Push Payment Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cloudpay-payment:latest ./services/payment-service
          docker push ${{ secrets.DOCKER_USERNAME }}/cloudpay-payment:latest

      - name: Configure Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy CloudPay
        run: |
          helm upgrade --install cloudpay ./cloudpay